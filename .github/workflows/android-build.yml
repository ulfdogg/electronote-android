name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: electronote-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: "Neuester Debug-Build"
          body: |
            Automatisch gebaut aus dem letzten Commit auf `main` (${{ github.sha }}).

            APK herunterladen und auf dem Tablet installieren (Einstellungen → Installation aus unbekannten Quellen erlauben), oder per `adb install -r app-debug.apk` nach dem Download.
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
